[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "data-science-portfolio"
version = "1.0.0"
description = "A curated portfolio of data science and machine learning projects spanning NLP, deep learning, time series analysis, dimensionality reduction, and vector databases."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Kwami Alfred Jordal BIAM", email = "alfred.biam@example.com"},
]
keywords = ["data-science", "machine-learning", "deep-learning", "nlp", "time-series", "portfolio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Data Science",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]
nlp = [
    "nltk>=3.8",
    "scikit-learn>=1.3",
]
deep-learning = [
    "tensorflow>=2.13",
    "keras>=2.13",
]
time-series = [
    "statsmodels>=0.14",
    "pmdarima>=2.0",
    "arch>=6.0",
]
vector-db = [
    "sentence-transformers>=2.2",
    "pinecone-client>=3.0",
    "python-dotenv>=1.0",
]
llm = [
    "transformers>=4.35",
    "torch>=2.0",
]
