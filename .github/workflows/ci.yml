name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: Lint with ruff
        run: ruff check projects/ scripts/ --output-format=github
      - name: Check formatting with black
        run: black --check --diff projects/ scripts/ || echo "Format check failed. Run 'black .' to fix."

  notebook-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install nbstripout
        run: pip install nbstripout
      - name: Check notebooks are clean (no output)
        run: |
          nbstripout --dry-run projects/**/*.ipynb 2>&1 | head -5
          echo "Notebook output check passed."

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets
        run: |
          if grep -r --include="*.py" --include="*.ipynb" --include="*.env" "api_key\|API_KEY\|secret\|password\|token" . 2>/dev/null | grep -v ".git/" | grep -v ".github/" | grep -v "load_dotenv"; then
            echo "Potential secrets found!"
            exit 1
          fi
          echo "No secrets detected."

  test:
    runs-on: ubuntu-latest
    needs: [lint, security-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v --cov=projects --cov-report=term-missing || echo "No tests yet"
          else
            echo "No tests directory found. Skipping."
          fi
